name: Banco PostgreSQL
on:
  push:
    paths: ['database/**', '.github/workflows/database.yml']
  pull_request:
    paths: ['database/**', '.github/workflows/database.yml']
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Integridade, isolamento e concorrência em banco descartável
        run: python3 database/tests/run.py --container '${{ job.services.postgres.id }}'
